<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark"><title>视频优先 · 交互样稿</title>
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="graphite.css">
</head>
<body>
<svg class="symbol-library" aria-hidden="true"><defs>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L20 8a2.1 2.1 0 0 0-4-4L5 15z"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M8 5H4v14h4M16 5h4v14h-4M8 12h8"/></symbol>
  <symbol id="i-records" viewBox="0 0 24 24"><rect x="5" y="4" width="15" height="13" rx="2"/><path d="M16 21H5a3 3 0 0 1-3-3V9M8 13l3-3 3 2 3-4"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 3 2 2-1 4 3 2 3-1 2 4 3-1 1-3 4-1 1-4-3-2V6l-4-1-2-3z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-full" viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 5 3 10l5 5M4 10h9a6 6 0 0 1 0 12"/></symbol>
  <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m3 14 9-10 9 8-7 8H9zM9 9l9 8M13 20h8"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m5 19 14-14M10 5h9v9"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 10 7-10 7z"/></symbol>
  <symbol id="i-mouse" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="6"/><path d="M12 3v7M6 10h12"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M6 9h1m4 0h1m4 0h1M6 13h1m4 0h1m4 0h1M7 16h10"/></symbol>
<symbol id="i-rect" viewBox="0 0 24 24"><rect x="5" y="6" width="14" height="12"/></symbol><symbol id="i-ellipse" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></symbol><symbol id="i-text" viewBox="0 0 24 24"><path d="M5 5h14M12 5v14M9 19h6"/></symbol><symbol id="i-shapes" viewBox="0 0 24 24"><path d="M5 4l5 8H1Z"/><rect x="12" y="3" width="8" height="8"/><circle cx="14" cy="17" r="4"/></symbol><symbol id="i-palette" viewBox="0 0 24 24"><path d="M20 12c0-5-4-8-8-8s-8 3-8 8 4 8 8 8c3 0 0-5 3-5h2c2 0 3-1 3-3Z"/><circle cx="8" cy="10" r=".6"/><circle cx="12" cy="7" r=".6"/><circle cx="16" cy="10" r=".6"/></symbol><symbol id="i-loop" viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 14-3l2 3M20 4v5h-5M20 15a8 8 0 0 1-14 3l-2-3M4 20v-5h5"/></symbol><symbol id="i-start" viewBox="0 0 24 24"><path d="M6 4v16M18 6l-7 6 7 6"/></symbol><symbol id="i-end" viewBox="0 0 24 24"><path d="M18 4v16M6 6l7 6-7 6"/></symbol><symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor" stroke="none"/></symbol><symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol><symbol id="i-maximize" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/></symbol></defs></svg>
<main id="viewer" class="viewer" tabindex="0"><header class="titlebar"><svg><use href="#i-full"/></svg><span>炎舞连斩</span><div class="window-controls"><button id="minimizeWindow" aria-label="最小化（样稿演示）"><svg><use href="#i-minus"/></svg></button><button id="maximizeWindow" aria-label="最大化 / 全屏"><svg><use href="#i-maximize"/></svg></button><button id="closeWindow" aria-label="关闭（样稿演示）"><svg><use href="#i-close"/></svg></button></div></header>
  <div id="mediaRegion" class="media-region"><canvas id="scene" aria-label="合成特效画面，点击播放，滚轮逐帧"></canvas></div>
  <input id="canvasText" class="canvas-text" aria-label="画面文字" placeholder="输入画面文字" hidden>
  <div class="fullscreen-zone"><button id="fullscreen" class="icon-button" aria-label="全屏，F11" title="全屏 · F11"><svg><use href="#i-full"/></svg></button></div>
  <div id="edgeTrigger" class="edge-trigger" aria-hidden="true"></div>
  <nav id="dock" class="dock glass" aria-label="观察工具">
    <button data-action="annotation" class="dock-button" aria-label="标注，N或D"><svg><use href="#i-pen"/></svg><span class="tooltip">标注 <kbd>N</kbd></span></button>
    <button data-action="clip" class="dock-button" aria-label="片段，R"><svg><use href="#i-clip"/></svg><span class="tooltip">片段 <kbd>R</kbd></span></button>
    <span class="dock-separator" aria-hidden="true"></span>
    <button data-action="records" class="dock-button" aria-label="标注记录" aria-expanded="false"><svg><use href="#i-records"/></svg><span class="tooltip">记录</span></button>
    <button data-action="settings" class="dock-button" aria-label="设置" aria-expanded="false"><svg><use href="#i-settings"/></svg><span class="tooltip">设置</span></button>
  </nav>
  <aside id="recordsPanel" class="records-panel" aria-label="标注记录" hidden>
    <div class="panel-heading"><span>记录</span><button class="icon-button" data-close="records" aria-label="收起记录"><svg><use href="#i-close"/></svg></button></div>
    <div id="selectedInfo" class="selected-info" aria-live="polite"></div>
    <div id="recordGrid" class="record-grid"></div>
  </aside>
  <section id="annotationEditor" class="annotation-editor glass" aria-label="文字与圈画标注" hidden>
    <div class="editor-heading"><span id="editorLabel">标注</span><select id="entryChoice" aria-label="选择同帧文字" hidden></select><button class="icon-button" data-close="annotation" aria-label="退出标注"><svg><use href="#i-close"/></svg></button></div>
    <textarea id="annotationInput" aria-label="当前画面的标注文字" placeholder="写下观察，也可以直接在画面上圈画…" spellcheck="false"></textarea>
    <div class="editor-footer"><span id="toolHint">手写 · 滚轮调整粗细</span><span>Enter / 画面右键保存</span></div>
    <p id="saveStatus" class="save-status" role="status" hidden></p><button id="checkSave" hidden>核对保存结果</button>
  </section>
  <section id="settingsPopover" class="settings-popover glass" aria-label="设置" hidden>
    <div class="panel-heading"><h1>设置</h1><button class="icon-button" data-close="settings" aria-label="关闭设置"><svg><use href="#i-close"/></svg></button></div>
    <label class="setting-row">预览画质<select id="quality"><option>720p</option><option selected>1080p</option></select></label>
    <label class="setting-row">缓存绿条<input id="cacheToggle" class="switch" type="checkbox"></label>
    <button id="showGuide" class="setting-row row-button">操作提示<span aria-hidden="true">↻</span></button>
    <details class="advanced"><summary>高级</summary><label class="setting-row">缓存额度<select id="ram"><option value="512">512 MiB</option><option value="1024" selected>1 GiB</option><option value="2048">2 GiB</option><option value="4096">4 GiB</option></select></label><label class="setting-row">提前解压<input id="predecode" class="switch" type="checkbox" checked></label><button id="clearDemoCache" class="quiet-button">清理其他缓存</button></details>
  </section>
  <section id="guide" class="guide glass" aria-label="操作提示" hidden>
    <div class="panel-heading"><span>把注意力留给画面</span><button id="dismissGuide" class="icon-button" aria-label="关闭操作提示"><svg><use href="#i-close"/></svg></button></div>
    <p><svg><use href="#i-mouse"/></svg><span>点击播放，滚轮逐帧</span></p>
    <p><svg><use href="#i-arrow"/></svg><span>按住左键：左右定位，上下调速</span></p>
    <p><svg><use href="#i-key"/></svg><span>右键甩动或长按，打开轮盘</span></p>
    <div class="guide-edge">标注、片段和记录，移到右侧即可找到 <span>›</span></div>
  </section>
  <div id="timeline" class="timeline" role="slider" tabindex="0" aria-label="视频进度" aria-valuemin="0" aria-valuemax="239" aria-valuenow="56">
    <div class="timeline-line"><div id="cacheStrip" class="cache-strip" hidden></div><div id="timelineProgress" class="timeline-progress"></div><div id="loopBand" class="loop-band" hidden></div></div>
    <div id="timelineMarkers" class="timeline-markers"></div>
    <span id="playhead" class="playhead"></span>
    <button id="headHandle" class="range-handle" aria-label="控制片段头部" hidden>头</button><button id="tailHandle" class="range-handle" aria-label="控制片段尾部" hidden>尾</button>
  </div>
  <div id="modeHint" class="mode-hint" role="status" hidden></div>
  <div id="transientNotice" class="transient-notice" role="status" hidden></div>
  <output id="rateHint" class="rate-hint" hidden></output>
  <div id="contextWheel" class="context-wheel glass" role="menu" aria-label="右键轮盘" hidden></div>
  <div id="gestureWheel" class="gesture-wheel" hidden><span><svg><use href="#i-loop"/></svg>倍速</span><span><svg><use href="#i-start"/></svg>定位</span><span><svg><use href="#i-start"/></svg>定位</span><span><svg><use href="#i-loop"/></svg>倍速</span></div>
  <dialog id="confirmDialog" class="confirm-dialog glass"><p id="confirmMessage"></p><div><button id="confirmBack">返回</button><button id="confirmDiscard">放弃</button><button id="confirmSave">保存</button></div></dialog>
</main>
<script src="model.js"></script><script src="scene.js"></script><script src="app.js"></script>
</body></html>
