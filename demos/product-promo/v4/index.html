<!doctype html><meta charset="utf-8"><title>功能演示 v4</title><style>
*{box-sizing:border-box}body{margin:0;background:#4c5964;color:#f2f5f7;font-family:'Microsoft YaHei UI','Segoe UI',sans-serif;overflow:hidden}body:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 45% 15%,#586672,#4a5863 75%,#43505b)}header{position:absolute;z-index:3;pointer-events:none;width:470px;top:325px}h1{font-size:60px;font-weight:650;line-height:1.4;margin:0;letter-spacing:1px}#subtitle{font-size:25px;color:#d1dbe3;margin-top:28px;line-height:1.7;white-space:pre-line}.frame{position:absolute;overflow:hidden;background:#14191e;box-shadow:0 22px 60px #17222c55}iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:none;transform-origin:0 0}#cursor{position:absolute;z-index:5;width:15px;height:20px;pointer-events:none;filter:drop-shadow(0 1px 1px #0009)}#pulse{position:absolute;z-index:4;width:22px;height:22px;border:1px solid #c3dce9aa;border-radius:50%;pointer-events:none;opacity:0}#ending{position:absolute;inset:0;display:grid;place-items:center;font-size:76px;font-weight:650;letter-spacing:3px;opacity:0;pointer-events:none;z-index:6}</style>
<div id="ending">给设计师的播放器</div><header><h1 id="title"></h1><div id="subtitle"></div></header><div class="frame"><iframe src="/plugin/index.html"></iframe></div><svg id="cursor" viewBox="0 0 20 26"><path d="M2 1 L2 21 L7 16 L11 25 L15 23 L11 15 L19 15 Z" fill="#eef4f8" stroke="#172731" stroke-width="1.2"/></svg><div id="pulse"></div>
<script>
const iframe=document.querySelector('iframe'),frame=document.querySelector('.frame'),header=document.querySelector('header'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),cursor=document.getElementById('cursor'),pulse=document.getElementById('pulse');
const smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*x*(x*(x*6-15)+10)},mix=(a,b,u)=>a+(b-a)*u;
const titles=[[0,8.9,'轮盘操作\n回看与调速','在画面中直接调整','left'],[22.9,30,'0.2× 慢放\n标注淡入淡出','跟随关键帧\n看清光束的变化','right'],[30.1,36,'选取片段\n循环观察','确定首尾\n反复比较同一段变化','right'],[44.7,58.2,'浏览记录\n回到关键帧','缩窄侧栏，滚动浏览\n点击缩略图返回','left'],[58.4,67,'设置\n逐级展开','从一级到三级\n选项按需出现','left']];
const cameras=[[0,1,720,450],[1.3,1,720,450],[2.3,1.8,720,350],[10.8,1.8,720,350],[11.8,1,720,450],[32.3,1,720,450],[33.2,2.1,270,820],[35.5,2.1,270,820],[36.5,1,720,450],[44.5,1,720,450],[45.5,1.8,720,340],[47.2,1.8,720,340],[48.3,1,720,450],[58.2,1,720,450],[59.2,1.5,410,450],[67,1.5,410,450]];
const layouts=[[0,600,140,1280,800],[10.8,600,140,1280,800],[11.8,128,20,1664,1040],[22.4,128,20,1664,1040],[23.5,50,140,1280,800],[35.5,50,140,1280,800],[36.5,128,20,1664,1040],[44.5,128,20,1664,1040],[45.5,600,140,1280,800],[58.2,600,140,1280,800],[59.2,600,90,1260,900],[67,600,90,1260,900]];
function track(keys,t){let i=0;while(i<keys.length-2&&t>=keys[i+1][0])i++;const a=keys[i],b=keys[i+1],u=smooth((t-a[0])/(b[0]-a[0]));return a.slice(1).map((_,k)=>mix(a[k+1],b[k+1],u));}
let lastTime=0,px=800,py=600;window.render=async t=>{await iframe.contentWindow.demo.render(t);window.scrollTo(0,0);frame.scrollTo(0,0);iframe.contentWindow.scrollTo(0,0);
const sc=titles.find(s=>t>=s[0]&&t<s[1]);if(sc){const fade=smooth((t-sc[0])/.65)*(1-smooth((t-(sc[1]-.65))/.65));title.innerText=sc[2];subtitle.textContent=sc[3];header.style.left=(sc[4]==='right'?1400:80)+'px';header.style.width=(sc[4]==='right'?450:470)+'px';header.style.opacity=fade;header.style.transform='translateY('+(12*(1-fade))+'px)';}else header.style.opacity=0;
const [left,top,width,height]=track(layouts,t),[z,cx,cy]=track(cameras,t),scale=Math.min(width/1440,height/900)*z,tx=width/2-cx*scale,ty=height/2-cy*scale;Object.assign(frame.style,{left:left+'px',top:top+'px',width:width+'px',height:height+'px'});iframe.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
const outro=smooth((t-66.6)/.9);frame.style.opacity=1-outro;frame.style.transform='scale('+(1-.025*outro)+')';if(t>=66.6)header.style.opacity=(1-outro)*Number(header.style.opacity);document.getElementById('ending').style.opacity=smooth((t-67.2)/.8);
const c=iframe.contentWindow.demo.cursor,x=left+tx+c.x*scale,y=top+ty+c.y*scale,blend=1-Math.exp(-Math.max(.001,t-lastTime)/.045);lastTime=t;px=mix(px,x,blend);py=mix(py,y,blend);cursor.style.left=px+'px';cursor.style.top=py+'px';cursor.style.opacity=c.hidden?0:1;pulse.style.left=(x-11)+'px';pulse.style.top=(y-11)+'px';pulse.style.opacity=c.click?.55:0;
window.pointerEvent=!c.hidden&&x>0&&x<1920&&y>0&&y<1080?{x,y}:{x:10,y:10};
const w=iframe.contentWindow.demo.wheel;window.wheelEvent=w?{x:left+tx+w.x*scale,y:top+ty+w.y*scale,deltaY:w.delta*scale,deltaX:0}:null;
};</script>
