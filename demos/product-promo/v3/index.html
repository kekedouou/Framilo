<!doctype html><meta charset="utf-8"><title>功能演示 v3</title><style>
*{box-sizing:border-box}body{margin:0;background:#4c5964;color:#f2f5f7;font-family:'Microsoft YaHei UI','Segoe UI',sans-serif;overflow:hidden}body:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 45% 15%,#586672,#4a5863 75%,#43505b)}header{position:absolute;z-index:3;pointer-events:none}h1{font-size:64px;font-weight:650;line-height:1.3;margin:0;letter-spacing:1px}#subtitle{font-size:25px;color:#d1dbe3;margin-top:22px;line-height:1.6}.frame{position:absolute;overflow:hidden;background:#14191e;box-shadow:0 22px 60px #17222c55}iframe{position:absolute;left:0;top:0;width:1440px;height:720px;border:none;transform-origin:0 0}#cursor{position:absolute;z-index:5;width:15px;height:20px;pointer-events:none;filter:drop-shadow(0 1px 1px #0009)}#pulse{position:absolute;z-index:4;width:22px;height:22px;border:1px solid #c3dce9aa;border-radius:50%;pointer-events:none;opacity:0}</style>
<header><h1 id="title"></h1><div id="subtitle"></div></header><div class="frame"><iframe src="/plugin/index.html"></iframe></div><svg id="cursor" viewBox="0 0 20 26"><path d="M2 1 L2 21 L7 16 L11 25 L15 23 L11 15 L19 15 Z" fill="#eef4f8" stroke="#172731" stroke-width="1.2"/></svg><div id="pulse"></div>
<script>
const iframe=document.querySelector('iframe'),frame=document.querySelector('.frame'),header=document.querySelector('header'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),cursor=document.getElementById('cursor'),pulse=document.getElementById('pulse');
const smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*x*(x*(x*6-15)+10)},mix=(a,b,u)=>a+(b-a)*u;
const scenes=[[0,'回看与调速','左键手势轮盘','side'],[16,'光束慢放，标注随行','0.2× 观察关键变化','top'],[28,'选取片段\n循环比较','反复观察关键瞬间','side'],[41.8,'从记录，回到关键帧','滚动浏览，点击定位','top'],[51,'设置\n按需展开','一级 → 二级 → 三级','side']];
const cameras=[[0,1,720,360],[1.9,1,720,360],[2.6,2.25,720,350],[10.8,2.25,720,350],[11.5,1,720,360],[12.6,1.4,800,440],[15,1.4,800,440],[15.7,1,720,360],[27.7,1,720,360],[28.4,2.25,720,340],[29.35,2.25,720,340],[30,2.7,300,586],[31.4,2.7,300,586],[32.05,2.2,360,500],[33.25,2.2,360,500],[34,1,720,360],[40.1,1,720,360],[40.65,2.25,720,340],[42.8,2.25,720,340],[43.5,1,720,360],[50.5,1,720,360],[51.4,1.8,420,360],[56,1.8,420,360]];
const layouts=[[0,640,240,1200,600],[.6,640,240,1200,600],[1.4,40,80,1840,920],[1.9,40,80,1840,920],[2.6,0,0,1920,1080],[10.8,0,0,1920,1080],[11.5,40,80,1840,920],[12.6,0,0,1920,1080],[15,0,0,1920,1080],[16,120,240,1680,840],[16.6,120,240,1680,840],[17.4,40,80,1840,920],[27.3,40,80,1840,920],[28,620,130,1260,840],[28.6,620,130,1260,840],[29.4,0,0,1920,1080],[33.25,0,0,1920,1080],[34,40,80,1840,920],[40.1,40,80,1840,920],[40.65,0,0,1920,1080],[41.8,120,240,1680,840],[42.3,120,240,1680,840],[43.3,40,80,1840,920],[50.3,40,80,1840,920],[51,620,130,1260,840],[51.5,620,130,1260,840],[52.3,0,0,1920,1080],[56,0,0,1920,1080]];
function track(keys,t){let i=0;while(i<keys.length-2&&t>=keys[i+1][0])i++;const a=keys[i],b=keys[i+1],u=smooth((t-a[0])/(b[0]-a[0]));return a.slice(1).map((_,k)=>mix(a[k+1],b[k+1],u));}
let lastTime=0,px=800,py=600;window.render=async t=>{await iframe.contentWindow.demo.render(t);window.scrollTo(0,0);frame.scrollTo(0,0);iframe.contentWindow.scrollTo(0,0);
const sc=scenes.findLast(s=>t>=s[0]),phase=t-sc[0],side=sc[3]==='side';title.innerText=sc[1];subtitle.textContent=sc[2];header.style.left=(side?80:120)+'px';header.style.top=(side?340:48)+'px';header.style.width=(side?470:1680)+'px';header.style.opacity=1-smooth((phase-.6)/.55);header.style.transform='translateY('+(-20*smooth((phase-.6)/.55))+'px)';
const [left,top,width,height]=track(layouts,t),[z,cx,cy]=track(cameras,t),scale=Math.min(width/1440,height/720)*z,tx=width/2-cx*scale,ty=height/2-cy*scale;Object.assign(frame.style,{left:left+'px',top:top+'px',width:width+'px',height:height+'px'});iframe.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
const c=iframe.contentWindow.demo.cursor,x=left+tx+c.x*scale,y=top+ty+c.y*scale,blend=1-Math.exp(-Math.max(.001,t-lastTime)/.065);lastTime=t;px=mix(px,x,blend);py=mix(py,y,blend);cursor.style.left=px+'px';cursor.style.top=py+'px';cursor.style.opacity=c.hidden?0:1;pulse.style.left=(x-11)+'px';pulse.style.top=(y-11)+'px';pulse.style.opacity=c.click?.55:0;
const w=iframe.contentWindow.demo.wheel;window.wheelEvent=w?{x:left+tx+w.x*scale,y:top+ty+w.y*scale,deltaY:w.delta*scale,deltaX:0}:null;
};</script>
