<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120"><rect width="1440" height="1120" fill="#e7e9ec"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="42" y="76" font-size="42" fill="#20262c" font-weight="600">Motionote</text><text x="850" y="52" font-size="15" fill="#20262c" font-weight="400">从特效观察出发的视频参考与标注播放器</text><text x="850" y="79" font-size="14" fill="#57636e" font-weight="400">Logo 首轮方向 / 先选构形，再细化字标与颜色</text><rect x="42" y="118" width="438" height="446" fill="#fff"/><text x="64" y="153" font-size="14" fill="#20262c" font-weight="700">A</text><text x="92" y="153" font-size="18" fill="#20262c" font-weight="600">折帧 M</text><text x="390" y="153" font-size="12" fill="#6e7c88" font-weight="400">Fold</text><rect x="64" y="174" width="394" height="252" fill="#080a0c"/><g transform="translate(197 205)" color="#eef1f4"><path fill="currentColor" d="M22 108V20L64 53 106 20V108H85V63L64 80 43 63V108Z"></path><path fill="#9bc4df" d="M43 37L64 53 85 37V63L64 80 43 63Z"></path></g><text x="190" y="386" font-size="30" fill="#eef1f4" font-weight="650">Motionote</text><g transform="translate(64 456) scale(0.125)" color="#20262c"><path fill="currentColor" d="M22 108V20L64 53 106 20V108H85V63L64 80 43 63V108Z"></path><path fill="currentColor" d="M43 37L64 53 85 37V63L64 80 43 63Z"></path></g><g transform="translate(106 452) scale(0.1875)" color="#20262c"><path fill="currentColor" d="M22 108V20L64 53 106 20V108H85V63L64 80 43 63V108Z"></path><path fill="currentColor" d="M43 37L64 53 85 37V63L64 80 43 63Z"></path></g><g transform="translate(148 448) scale(0.25)" color="#20262c"><path fill="currentColor" d="M22 108V20L64 53 106 20V108H85V63L64 80 43 63V108Z"></path><path fill="currentColor" d="M43 37L64 53 85 37V63L64 80 43 63Z"></path></g><text x="310" y="468" font-size="11" fill="#75808a" font-weight="400">16 / 24 / 32 px · 单色</text><text x="64" y="508" font-size="13" fill="#586572" font-weight="400">把 Motion 的 M 折成连续画面。轮廓硬朗，适</text><text x="64" y="529" font-size="13" fill="#586572" font-weight="400">合小图标。</text><rect x="500" y="118" width="438" height="446" fill="#fff"/><text x="522" y="153" font-size="14" fill="#20262c" font-weight="700">B</text><text x="550" y="153" font-size="18" fill="#20262c" font-weight="600">留下注记</text><text x="848" y="153" font-size="12" fill="#6e7c88" font-weight="400">Margin</text><rect x="522" y="174" width="394" height="252" fill="#080a0c"/><g transform="translate(655 205)" color="#eef1f4"><path fill="none" stroke="currentColor" stroke-width="11" d="M78 23H23V105H105V59"></path><path fill="#9bc4df" d="M91 14H114V45L102.5 38 91 45Z"></path></g><text x="648" y="386" font-size="30" fill="#eef1f4" font-weight="500">Motionote</text><g transform="translate(522 456) scale(0.125)" color="#20262c"><path fill="none" stroke="currentColor" stroke-width="11" d="M78 23H23V105H105V59"></path><path fill="currentColor" d="M91 14H114V45L102.5 38 91 45Z"></path></g><g transform="translate(564 452) scale(0.1875)" color="#20262c"><path fill="none" stroke="currentColor" stroke-width="11" d="M78 23H23V105H105V59"></path><path fill="currentColor" d="M91 14H114V45L102.5 38 91 45Z"></path></g><g transform="translate(606 448) scale(0.25)" color="#20262c"><path fill="none" stroke="currentColor" stroke-width="11" d="M78 23H23V105H105V59"></path><path fill="currentColor" d="M91 14H114V45L102.5 38 91 45Z"></path></g><text x="768" y="468" font-size="11" fill="#75808a" font-weight="400">16 / 24 / 32 px · 单色</text><text x="522" y="508" font-size="13" fill="#586572" font-weight="400">取景框留出一个缺口，让标记落在画面边缘。</text><rect x="958" y="118" width="438" height="446" fill="#fff"/><text x="980" y="153" font-size="14" fill="#20262c" font-weight="700">C</text><text x="1008" y="153" font-size="18" fill="#20262c" font-weight="600">运动轨迹</text><text x="1306" y="153" font-size="12" fill="#6e7c88" font-weight="400">Trace</text><rect x="980" y="174" width="394" height="252" fill="#080a0c"/><g transform="translate(1113 205)" color="#eef1f4"><path fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" d="M22 99V46C22 16 44 20 64 58C84 20 106 16 106 46V99"></path><path fill="none" stroke="#9bc4df" stroke-width="13" stroke-linecap="round" d="M64 58V84"></path></g><text x="1106" y="386" font-size="30" fill="#eef1f4" font-weight="400">Motionote</text><g transform="translate(980 456) scale(0.125)" color="#20262c"><path fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" d="M22 99V46C22 16 44 20 64 58C84 20 106 16 106 46V99"></path><path fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" d="M64 58V84"></path></g><g transform="translate(1022 452) scale(0.1875)" color="#20262c"><path fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" d="M22 99V46C22 16 44 20 64 58C84 20 106 16 106 46V99"></path><path fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" d="M64 58V84"></path></g><g transform="translate(1064 448) scale(0.25)" color="#20262c"><path fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" d="M22 99V46C22 16 44 20 64 58C84 20 106 16 106 46V99"></path><path fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" d="M64 58V84"></path></g><text x="1226" y="468" font-size="11" fill="#75808a" font-weight="400">16 / 24 / 32 px · 单色</text><text x="980" y="508" font-size="13" fill="#586572" font-weight="400">用一笔流动的轨迹写出 m。强调动作与连续观察。</text><rect x="42" y="584" width="438" height="446" fill="#fff"/><text x="64" y="619" font-size="14" fill="#20262c" font-weight="700">D</text><text x="92" y="619" font-size="18" fill="#20262c" font-weight="600">画面引语</text><text x="390" y="619" font-size="12" fill="#6e7c88" font-weight="400">Quote</text><rect x="64" y="640" width="394" height="252" fill="#080a0c"/><g transform="translate(197 671)" color="#eef1f4"><path fill="currentColor" d="M18 26H58V65L35 103H18L37 66H18Z"></path><path fill="#9bc4df" d="M70 26H110V65L87 103H70L89 66H70Z"></path></g><text x="190" y="852" font-size="30" fill="#eef1f4" font-weight="650">Motionote</text><g transform="translate(64 922) scale(0.125)" color="#20262c"><path fill="currentColor" d="M18 26H58V65L35 103H18L37 66H18Z"></path><path fill="currentColor" d="M70 26H110V65L87 103H70L89 66H70Z"></path></g><g transform="translate(106 918) scale(0.1875)" color="#20262c"><path fill="currentColor" d="M18 26H58V65L35 103H18L37 66H18Z"></path><path fill="currentColor" d="M70 26H110V65L87 103H70L89 66H70Z"></path></g><g transform="translate(148 914) scale(0.25)" color="#20262c"><path fill="currentColor" d="M18 26H58V65L35 103H18L37 66H18Z"></path><path fill="currentColor" d="M70 26H110V65L87 103H70L89 66H70Z"></path></g><text x="310" y="934" font-size="11" fill="#75808a" font-weight="400">16 / 24 / 32 px · 单色</text><text x="64" y="974" font-size="13" fill="#586572" font-weight="400">从视频中摘下一段观察。双引号同时带出向前的节奏。</text><rect x="500" y="584" width="438" height="446" fill="#fff"/><text x="522" y="619" font-size="14" fill="#20262c" font-weight="700">E</text><text x="550" y="619" font-size="18" fill="#20262c" font-weight="600">捕捉一刻</text><text x="848" y="619" font-size="12" fill="#6e7c88" font-weight="400">Moment</text><rect x="522" y="640" width="394" height="252" fill="#080a0c"/><g transform="translate(655 671)" color="#eef1f4"><path fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="butt" d="M104 55A43 43 0 1 1 72 22"></path><path fill="currentColor" d="M52 43L81 63 52 83Z"></path><circle fill="#9bc4df" cx="96" cy="30" r="10"></circle></g><text x="648" y="852" font-size="30" fill="#eef1f4" font-weight="500">Motionote</text><g transform="translate(522 922) scale(0.125)" color="#20262c"><path fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="butt" d="M104 55A43 43 0 1 1 72 22"></path><path fill="currentColor" d="M52 43L81 63 52 83Z"></path><circle fill="currentColor" cx="96" cy="30" r="10"></circle></g><g transform="translate(564 918) scale(0.1875)" color="#20262c"><path fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="butt" d="M104 55A43 43 0 1 1 72 22"></path><path fill="currentColor" d="M52 43L81 63 52 83Z"></path><circle fill="currentColor" cx="96" cy="30" r="10"></circle></g><g transform="translate(606 914) scale(0.25)" color="#20262c"><path fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="butt" d="M104 55A43 43 0 1 1 72 22"></path><path fill="currentColor" d="M52 43L81 63 52 83Z"></path><circle fill="currentColor" cx="96" cy="30" r="10"></circle></g><text x="768" y="934" font-size="11" fill="#75808a" font-weight="400">16 / 24 / 32 px · 单色</text><text x="522" y="974" font-size="13" fill="#586572" font-weight="400">播放环上的一个注记点。更直观，也更接近通用播放器。</text><rect x="958" y="584" width="438" height="446" fill="#d7dfe6"/><text x="988" y="645" font-size="32" fill="#20262c" font-weight="400">看见运动。</text><text x="988" y="688" font-size="32" fill="#20262c" font-weight="400">留下观察。</text><text x="988" y="739" font-size="15" fill="#435361" font-weight="400">五种构形，一套克制的颜色。</text><text x="988" y="765" font-size="15" fill="#435361" font-weight="400">不靠立体效果或换色区分方案。</text><text x="988" y="818" font-size="14" fill="#334451" font-weight="400">A · 更鲜明的字母标识</text><text x="988" y="846" font-size="14" fill="#334451" font-weight="400">B · 更强调画面与标注</text><text x="988" y="874" font-size="14" fill="#334451" font-weight="400">C · 更柔和的运动感</text><text x="988" y="902" font-size="14" fill="#334451" font-weight="400">D · 更独立的品牌符号</text><text x="988" y="930" font-size="14" fill="#334451" font-weight="400">E · 更直接的播放含义</text><text x="988" y="1000" font-size="12" fill="#586572" font-weight="400">矢量初稿 · 尚未替换插件图标</text><text x="42" y="1070" font-size="12" fill="#66737f" font-weight="400">图形独立绘制；无外部字体、素材或网络请求。</text><text x="1180" y="1070" font-size="12" fill="#66737f" font-weight="400">自用产品化 / Round 1</text></g></svg>